name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: 'dsh checkout ref（tag / branch / commit）'
        required: false
        default: 'dsh-v0.2.0-rc.2'
      dsh_market_ref:
        description: 'dsh-market checkout ref（tag / branch / commit）'
        required: false
        default: 'v1.26.0'
      version:
        description: 'Release tag（例如 v0.1.0，仅手动触发时需填写）'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # 本工程经 ../deepseek-harness 同级源码引用 dsh（非 submodule）。
      # actions/checkout 的 path 限制在 $GITHUB_WORKSPACE 内，故改用 git clone 到同级目录。
      - name: Checkout dsh (sibling)
        shell: bash
        env:
          DSH_REF: ${{ github.event.inputs.dsh_ref || 'dsh-v0.2.0-rc.2' }}
        run: |
          git clone --depth 1 --branch "${DSH_REF}" \
            https://github.com/deepseek-ai/deepseek-harness.git ../deepseek-harness

      # dsh-market（插件市场）同样以 ../dsh-market 同级源码引用：collect-dsh.mjs 物化其
      # 构建产物为 dsh-dist/node_modules/dshmarket，缺失则打包硬失败。默认 tag v1.26.0。
      - name: Checkout dsh-market (sibling)
        shell: bash
        env:
          DSH_MARKET_REF: ${{ github.event.inputs.dsh_market_ref || 'v1.26.0' }}
        run: |
          git clone --depth 1 --branch "${DSH_MARKET_REF}" \
            https://github.com/dsh-market/dsh-market.git ../dsh-market

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # dsh 脚本用 `corepack pnpm`，且 dsh 的 build 脚本内部还有嵌套的 `pnpm` 调用，
      # 需 corepack enable 创建 pnpm shim 到 PATH，否则嵌套调用报 `pnpm: not found`。
      - name: Enable corepack
        run: corepack enable

      # maker-deb 需 fakeroot + dpkg（dpkg 已预装）；maker-rpm 需 rpmbuild（rpm 包提供）。
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Build dsh (apply patches + build)
        run: npm run build:dsh

      - name: Make
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: out/make/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # upload-artifact v4 解压后文件执行权限会丢失（归 644/755）。
      - name: Restore exec permissions
        run: chmod -R +x artifacts 2>/dev/null || true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.nupkg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.dmg
            artifacts/**/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
